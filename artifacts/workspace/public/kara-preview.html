<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northstar Guidance — Kara preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #121820; color: #e8f0ea; font-family: Nunito, sans-serif; }
    .stage { position: relative; min-height: 100dvh; overflow: hidden; }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(18 24 32 / .88) 0%, rgb(18 24 32 / .55) 48%, rgb(18 24 32 / .2) 100%); }
    .copy { position: relative; z-index: 10; max-width: 40rem; padding: 12vh 1.5rem 2rem; }
    .badge { display: inline-block; background: #3e6b5633; color: #e8f0ea; border-radius: 999px; padding: .25rem .7rem; font-size: .75rem; }
    .title-wrap { position: relative; isolation: isolate; margin-top: 1rem; }
    h1 { font-family: Fraunces, serif; font-size: clamp(2rem, 6vw, 3.2rem); margin: .4rem 0 0; font-weight: 600; }
    .sub { letter-spacing: .08em; opacity: .7; font-size: .9rem; margin-top: .35rem; }
    p.lead { max-width: 28rem; opacity: .82; line-height: 1.45; }
    canvas.layer { position: absolute; left: 0; right: 0; top: -1.5rem; height: 7.5rem; width: 100%; pointer-events: none; }
    .back { z-index: 0; }
    .front { z-index: 20; }
    .title { position: relative; z-index: 10; }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="/game/title-dusk.jpg" alt="" />
    <div class="veil"></div>
    <div class="copy">
      <span class="badge">Family continuity training</span>
      <div class="title-wrap" id="wrap">
        <canvas id="back" class="layer back"></canvas>
        <div class="title">
          <h1>Northstar Guidance</h1>
          <div class="sub">Event Sim</div>
        </div>
        <canvas id="front" class="layer front"></canvas>
      </div>
      <p class="lead">Preview of Kara Wari orbiting the title. In the full game she also follows the player as the floating compass guide.</p>
    </div>
  </div>
  <script>
    const wrap = document.getElementById("wrap");
    const back = document.getElementById("back");
    const front = document.getElementById("front");
    const dust = [];
    function resize() {
      const r = wrap.getBoundingClientRect();
      for (const c of [back, front]) {
        c.width = Math.max(1, Math.floor(r.width));
        c.height = Math.max(1, Math.floor(r.height + 36));
      }
    }
    resize();
    addEventListener("resize", resize);
    function drawCompass(ctx, x, y, s, glow) {
      const g = ctx.createRadialGradient(x, y, 1, x, y, 16 * s);
      g.addColorStop(0, `rgba(140, 220, 200, ${0.28 + glow * 0.2})`);
      g.addColorStop(1, "rgba(140, 220, 200, 0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 16 * s, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 11 * s, 0, Math.PI * 2);
      ctx.fillStyle = "#c4a574"; ctx.fill();
      ctx.strokeStyle = "#8a7040"; ctx.lineWidth = 1.2 * s; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 8.4 * s, 0, Math.PI * 2);
      ctx.fillStyle = "#f4efe4"; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, y - 7 * s);
      ctx.lineTo(x + 1.8 * s, y + 0.6 * s);
      ctx.lineTo(x - 1.8 * s, y + 0.6 * s);
      ctx.closePath();
      ctx.fillStyle = "#4a9b8c"; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 1.6 * s, 0, Math.PI * 2);
      ctx.fillStyle = "#2f5c4f"; ctx.fill();
    }
    function tick(now) {
      const w = back.width, h = back.height;
      const b = back.getContext("2d"), f = front.getContext("2d");
      b.clearRect(0,0,w,h); f.clearRect(0,0,w,h);
      const t = now / 1000;
      const cx = w * 0.42, cy = h * 0.42;
      const ang = t * 0.55;
      const x = cx + Math.cos(ang) * Math.min(w * 0.46, 210);
      const y = cy + Math.sin(ang * 1.08) * 28 + Math.sin(t * 2.1) * 3;
      const depth = Math.sin(ang);
      const scale = 0.88 + depth * 0.14;
      const glow = 0.5 + Math.max(0, Math.cos(ang * 2)) * 0.5;
      if (Math.random() < 0.45) dust.push({ x, y, vx:(Math.random()-0.5)*12, vy:8+Math.random()*14, life:0.9, z:depth });
      for (const p of dust) {
        p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.life -= 0.016;
        const ctx = p.z >= 0 ? f : b;
        ctx.fillStyle = `rgba(210,240,225,${Math.max(0,p.life)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2); ctx.fill();
      }
      while (dust.length && dust[0].life <= 0) dust.shift();
      drawCompass(depth >= 0 ? f : b, x, y, scale, glow);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
